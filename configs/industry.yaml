# Импульсный граф креативности отрасли.
# Рабочая версия 0.1, ноябрь 2026. Описание — model/otrasl.tex.
#
# Отличие от предприятийного каркаса (configs/karkas.yaml):
#   * объект — отрасль (ОКВЭД), а не предприятие;
#   * меры — инструменты промышленной политики p1/p2/p3;
#   * цель — i3, отгруженная инновационная продукция (58761), +25 % за 60 мес.;
#   * горизонт — 60 мес., потому что лаги НИОКР, инфраструктуры и кадров
#     длиннее, чем на предприятии;
#   * критерий — k = R / C, где R — прирост i3 в млн руб. относительно
#     базового сценария, C — бюджет мер в млн руб.;
#   * k_obs = 58761 / 60020 — отдельная наблюдаемая отдача затрат на
#     инновации, не критерий плана.
#
# Соглашения:
#   * все показатели i/o нормированы: x=0 — база, x=1 — цель, x>1 — перевыполнение;
#   * direction: up — «больше — лучше»; down — «меньше — лучше»;
#   * для среды y значение сценария — отклонение от номинала;
#     y1 (инвестиции), y2 (спрос) — рост в «хорошую» сторону;
#     y3 (конкуренция), y4 (дефицит кадров) — рост в «плохую» сторону;
#   * cost_mode: one_time — стоимость меры списывается один раз за план;
#     для реального бюджета использовать monthly/spread и годовые нормы;
#   * revenue_mode: rubles — R считается в млн руб. по монетизации i3;
#     r=1e6 переводит млн руб. в рубли, volume=1.
#
# Веса, пороги и задержки — класс Э (экспертная оценка), кроме явно
# указанных. Это не калибровка: числа-заглушки для проверки логики.

model:
  version: "0.2-industry-data"
  horizon: 60          # месяцев
  dt: 1
  saturation: ceiling  # (x_max - x), как в karkas.tex v1.2
  theta: 0.35          # базовый порог; у i3 ниже — см. узел i3
  mu: 0.01             # деградация, 1/мес
  x_max: 1.6
  gain: 1.0
  budget_max: 200.0    # млн руб. на горизонт
  cost_mode: one_time
  revenue_mode: rubles
  target_node: i3
  target_level: 1.0

nodes:
  p1:
    kind: measure
    label: "Субсидии и гранты на НИОКР"
    short: "p1 · субсидии НИОКР"
    unit: ""
    direction: up
    cost: 50.0          # млн руб., разово; заменить на годовую программу
    owner: "Минпром / региональный фонд"
    position: [0.0, 4.6]

  p2:
    kind: measure
    label: "Технопарки, инжиниринговые центры, кластеры"
    short: "p2 · инфраструктура"
    unit: ""
    direction: up
    cost: 80.0
    owner: "Минпром / корпорация развития"
    position: [0.0, 2.2]

  p3:
    kind: measure
    label: "Обучение, консалтинг, инновационные ваучеры"
    short: "p3 · кадры и консалтинг"
    unit: ""
    direction: up
    cost: 30.0
    owner: "Минтруд / центр компетенций"
    position: [0.0, -0.2]

  i1:
    kind: indicator
    label: "Доля инновационно-активных организаций"
    short: "i1 · вовлечённость"
    unit: "%"
    direction: up
    # ЕМИСС 58769, класс 28, среднее 2019--2022; цель +25 %.
    base: 41.31
    target: 51.64
    rise: 18
    theta: 0.35
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [4.0, 2.2]

  i2:
    kind: indicator
    label: "Интенсивность затрат на инновации"
    short: "i2 · интенсивность НИОКР"
    unit: "% выручки"
    direction: up
    # ЕМИСС 60022, класс 28, среднее 2019--2022; цель +25 %.
    # Прежняя прокси-доля 60020/57711 даёт другой уровень (см. calibration).
    base: 2.38
    target: 2.98
    rise: 12
    theta: 0.35
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [4.0, 4.6]

  i3:
    kind: indicator
    label: "Отгруженная инновационная продукция"
    short: "i3 · инновационная продукция"
    unit: "млн руб."
    direction: up
    base: 800.0
    target: 1000.0      # +25 % за 60 мес.
    rise: 24
    theta: 0.30         # ниже базового: конверсия в выпуск идёт через большее число звеньев
    mu: 0.01
    x_max: 1.6
    # r=1e6: 1 млн руб. = 1e6 руб.; volume=1. Тогда _rub_effect даёт млн руб.
    monetization: {r: 1000000.0, volume: 1.0}
    position: [7.8, 2.2]

  i4:
    kind: indicator
    label: "Человеческий капитал отрасли (прокси: зарплатная премия и занятость)"
    short: "i4 · человеческий капитал"
    unit: "индекс"
    direction: up
    base: 100.0
    target: 115.0
    rise: 24
    theta: 0.35
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [4.0, -0.2]

  o1:
    kind: indicator
    label: "Выпуск (отгружено товаров собственного производства)"
    short: "o1 · выпуск"
    unit: "индекс"
    direction: up
    base: 100.0
    target: 110.0
    rise: 18
    theta: 0.35
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [11.2, 4.6]

  o2:
    kind: indicator
    label: "Производительность труда"
    short: "o2 · производительность"
    unit: "индекс"
    direction: up
    base: 100.0
    target: 110.0
    rise: 24
    theta: 0.35
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [11.2, 2.2]

  o3:
    kind: indicator
    label: "Рентабельность проданных товаров, работ, услуг"
    short: "o3 · рентабельность"
    unit: "индекс"
    direction: up
    base: 100.0
    target: 110.0
    rise: 18
    theta: 0.35
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [11.2, -0.2]

  y1:
    kind: environment
    label: "Инвестиции и доступность технологий"
    short: "y1 · инвестиции"
    unit: "отклонение"
    direction: up
    nominal: 0.0
    position: [1.5, 6.4]

  y2:
    kind: environment
    label: "Спрос (темп выпуска по отрасли на федеральном уровне)"
    short: "y2 · спрос"
    unit: "отклонение"
    direction: up
    nominal: 0.0
    position: [8.0, 6.2]

  y3:
    kind: environment
    label: "Конкуренция (число организаций, концентрация)"
    short: "y3 · конкуренция"
    unit: "отклонение"
    direction: down
    nominal: 0.0
    position: [5.0, 7.4]

  y4:
    kind: environment
    label: "Дефицит квалификации на рынке труда"
    short: "y4 · дефицит кадров"
    unit: "отклонение"
    direction: down
    nominal: 0.0
    position: [1.5, -2.0]

edges:
  # --- меры -> факторы -------------------------------------------------
  - {from: p1, to: i2, w: 0.55, delay: 6,  source: "Э", mechanism: "субсидии поднимают интенсивность НИОКР"}
  - {from: p1, to: i1, w: 0.25, delay: 9,  source: "Э", mechanism: "субсидии снижают барьер входа"}
  - {from: p2, to: i1, w: 0.45, delay: 12, source: "Э", mechanism: "инфраструктура снижает барьер участия"}
  - {from: p2, to: i4, w: 0.30, delay: 18, source: "Э", mechanism: "кластеры удерживают кадры"}
  - {from: p2, to: i3, w: 0.30, delay: 18, source: "Э", mechanism: "пилоты и общая инфраструктура ускоряют выпуск"}
  - {from: p3, to: i4, w: 0.50, delay: 12, source: "Э", mechanism: "обучение наращивает человеческий капитал"}
  - {from: p3, to: i1, w: 0.30, delay: 9,  source: "Э", mechanism: "консалтинг снижает барьер участия"}
  - {from: p3, to: i3, w: 0.20, delay: 18, source: "Э", mechanism: "абсорбционная способность ускоряет конверсию"}

  # --- факторы -> факторы ----------------------------------------------
  - {from: i2, to: i1, w: 0.45, delay: 6,  source: "Э", mechanism: "НИОКР расширяют инновационную активность"}
  - {from: i4, to: i1, w: 0.40, delay: 12, source: "Э", mechanism: "кадры расширяют участие"}
  - {from: i1, to: i3, w: 0.60, delay: 12, source: "Э", mechanism: "массовость конвертируется в новую продукцию"}
  - {from: i2, to: i3, w: 0.40, delay: 18, source: "Э", mechanism: "НИОКР напрямую дают новую продукцию"}
  - {from: i4, to: i3, w: 0.30, delay: 18, source: "Э", mechanism: "кадры ускоряют конверсию"}

  # --- факторы -> исходы -----------------------------------------------
  - {from: i3, to: o1, w: 0.50, delay: 6,  source: "Э", mechanism: "новая продукция увеличивает выпуск"}
  - {from: i1, to: o2, w: 0.35, delay: 12, source: "Э", mechanism: "активность повышает производительность"}
  - {from: i2, to: o2, w: 0.30, delay: 24, source: "Э", mechanism: "НИОКР повышают производительность"}
  - {from: i3, to: o3, w: 0.45, delay: 6,  source: "Э", mechanism: "новая продукция увеличивает прибыль"}

  # --- среда -> факторы -------------------------------------------------
  - {from: y1, to: i2, w: 0.35, delay: 12, source: "С", mechanism: "инвестиции в технологии поднимают НИОКР"}
  - {from: y2, to: i3, w: 0.30, delay: 6,  source: "С", mechanism: "спрос вытягивает новую продукцию"}
  - {from: y4, to: i4, w: -0.40, delay: 12, source: "С", mechanism: "дефицит кадров тормозит человеческий капитал"}

  # --- опциональные обратные связи ------------------------------------
  - {from: y3, to: i1, w: -0.20, delay: 3,  source: "С", mechanism: "конкурентное давление; знак неоднозначен", optional: true}
  # Движок не обновляет среду, поэтому петля «выпуск -> инвестиции -> НИОКР»
  # свёрнута в дугу o1->i2: y1 остаётся экзогенным, а инвестиционный канал
  # входит в i2 с длинным лагом. Это приближение, а не полная петля.
  - {from: o1, to: i2, w: 0.20, delay: 18, source: "Э", mechanism: "выпуск через инвестиции финансирует НИОКР (прокси y1)", optional: true}
  - {from: o3, to: i2, w: 0.25, delay: 12, source: "Э", mechanism: "прибыль финансирует НИОКР", optional: true}

plans:
  p1:
    label: "P1 · только субсидии на НИОКР"
    measures: {p1: 0}
  p2:
    label: "P2 · только инфраструктура и кластеры"
    measures: {p2: 0}
  p3:
    label: "P3 · только кадры и консалтинг"
    measures: {p3: 0}
  p1p2:
    label: "P12 · субсидии + инфраструктура"
    measures: {p1: 0, p2: 0}
  p1p3:
    label: "P13 · субсидии + кадры"
    measures: {p1: 0, p3: 0}
  p2p3:
    label: "P23 · инфраструктура + кадры"
    measures: {p2: 0, p3: 0}
  full:
    label: "Полный набор"
    measures: {p1: 0, p2: 0, p3: 0}
  sequence:
    label: "Сначала кадры, затем субсидии (p3 с 0, p1 с 6)"
    measures: {p3: 0, p1: 6}

scenarios:
  nominal:
    label: "Номинальный"
    values: {}
  demand_slump:
    label: "Спад спроса"
    values: {y2: -0.5}
  investment_freeze:
    label: "Заморозка инвестиций"
    values: {y1: -0.4}
  skill_shortage:
    label: "Дефицит квалификации"
    values: {y4: 0.4}
  competition_shock:
    label: "Усиление конкуренции"
    values: {y3: 0.3}
  import_blockade:
    label: "Технологическая блокада: инвестиции и спрос"
    atomic: false
    values: {y1: -0.3, y2: -0.2}
  combined_stress:
    label: "Комбинированный стресс"
    atomic: false
    values: {y1: -0.4, y2: -0.5, y3: 0.3, y4: 0.4}

# --- данные ---------------------------------------------------------------
# Панели ЕМИСС лежат вне репозитория движка. root: null означает поиск
# по кандидатам (GC_DATA_ROOT, затем docs/reports/master/data/rosstat
# рядом с репозиторием). Калибровка: scripts/calibrate_industry.py.
data:
  root: null
  level: country
  okved: ["24", "25", "26", "27", "28", "29", "30", "33"]
  pilot_okved: "28"
  base_years: [2019, 2022]   # общее окно i1, i2, i3 и k_obs
  target_growth: 0.25        # та же цель +25 %, что у i3

  nodes:
    i1:       {id: "58769", role: primary}      # доля инновационно-активных, %
    i1_alt:   {id: "58765", role: alternative}  # все организации, %
    i2:       {id: "60022", role: primary}      # интенсивность затрат, % выручки
    i2_abs:   {id: "60020", role: alternative}  # абсолютные затраты, тыс. руб.
    i3:       {id: "58761", role: primary}      # инновационная продукция, тыс. руб.
    i3_share: {id: "58762", role: robustness}   # доля инновационной продукции, %
    o1:       {id: "57711", role: primary}      # отгружено, тыс. руб.
    o1_alt:   {id: "57715", role: robustness, period: 118}  # другая методология
    o1_full:  {id: "58554", role: robustness}   # полный круг, 2017--2022
    o3:       {id: "58261", role: primary}      # рентабельность продаж, %
    o3_alt:   {id: "58036", role: robustness}   # уровень рентабельности, %
    i4:       {id: "58701", role: primary}      # зарплата, руб.
    i4_alt:   {id: "57824", role: robustness}   # зарплата, другой ряд
    y1:       {id: "59084", role: primary}      # инвестиции по ОКВЭД, тыс. руб.
    y1_long:  {id: "59048", role: robustness}   # полный круг, 2014--2022
    y1_q:     {id: "58090", role: robustness, kind: quarter}  # только I квартал

  pairs:
    - [i1, i1_alt]
    - [i2, i2_implied]      # i2_implied = 60020 / 57711, % выручки
    - [i3, i3_share]
    - [o1, o1_alt]
    - [o1, o1_full]
    - [o3, o3_alt]
    - [i4, i4_alt]
    - [y1, y1_long]
    - [y1, y1_q]
