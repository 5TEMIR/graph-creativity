# Каркасная модель повышения креативности: калибровка под модельный пример
# статьи «Подход к повышению креативности производственных предприятий»
# (Резчиков, Дранко, Степановская, Богомолов, 2026).
#
# Сохранён минимальный каркас из karkas.tex: X1-X4, X7; Y2, Y3, Y5; m1, m3, m4.
# Показатели X5, X6, X8 и факторы Y1, Y4 в статье упоминаются, но в каркас не
# входят: для сравнения P1/P2 по критерию k = R / C достаточно этих вершин.
#
# Модельный пример статьи:
#   P1 — централизованная экосистема инноваций: 50-70 млн руб., эффект
#        30-40 % за 3 года, первые результаты через 12-18 мес., плато 24-36 мес.;
#   P2 — распределённая культура непрерывных улучшений: 10-20 млн руб.,
#        эффект 15-25 % за 3 года, первые результаты через 3-6 мес.;
#   гибрид — сначала P2, со второго года элементы P1 (акселератор).
#
# Калибровка в номинальном сценарии на 36 мес.:
#   P1:     C = 70 млн, R = 30,1 %, T = 33 мес., k = 0,43;
#   P2:     C = 15 млн, R = 22,7 %, цель 25 % не достигнута, k = 1,51;
#   hybrid: C = 50 млн, R = 31,9 %, T = 31 мес., k = 0,64;
#   full:   C = 85 млн, R = 37,3 %, T = 23 мес., k = 0,44.
# P2 выгоднее по k, но не даёт целевого уровня; P1 достигает цели, но позже
# и дороже; гибрид соединяет быстрый старт P2 с акселератором P1.
# Первые эффекты P2 видны в ведущих X2/X3 через 3-6 мес.; X1 пересекает
# уровень 2 % на 11-м месяце, а целевые 25 % — только при подключении P1.
#
# Соглашения:
#   * все показатели X нормированы: x=0 — базовый уровень, x=1 — целевой;
#     x>1 — перевыполнение цели, потолок задаётся x_max;
#   * direction: up  — «больше — лучше» (x растёт вместе с физическим показателем);
#               down — «меньше — лучше» (x растёт при снижении физического показателя);
#   * для среды Y значение сценария — отклонение от номинала: Y3 (рыночное
#     давление) и Y5 (дефицит квалификации) растут в «плохую» сторону;
#     Y2 (доступность грантов) может отклоняться в любую сторону, сокращение
#     задаётся отрицательным значением;
#   * cost_mode: one_time — стоимость меры списывается один раз за весь план
#     (в первый месяц активности), повторные применения её не увеличивают;
#   * m4 — патентование — имеет длинный прямой лаг (30 мес.), поэтому P1
#     выходит на плато после 24 мес.; m3 (акселератор) даёт первые результаты
#     раньше, а m1 (P2) — ещё раньше через X2 и X3.

model:
  version: "1.3-article-example"  # калибровка под пример статьи, не karkas.tex
  horizon: 36          # месяцев
  dt: 1
  saturation: ceiling  # ceiling: (x_max - x); strict: (1 - x) как буквально в статье
  theta: 0.42          # базовый порог; у X1 ниже — см. комментарий в узле X1
  mu: 0.01             # деградация, 1/мес
  x_max: 1.6           # потолок насыщения (приложение А karkas.tex)
  gain: 1.0            # глобальный множитель всех весов (для сканов)
  budget_max: 90.0     # млн руб.; full = 85, P1 = 70, hybrid = 50
  cost_mode: one_time
  revenue_mode: percent
  target_node: X1
  target_level: 1.0    # 25 % прироста X1: база 100 -> цель 125

nodes:
  X1:
    kind: indicator
    label: "Индекс креативной активности"
    short: "X1 · креативная активность"
    unit: "ед./год"
    direction: up
    base: 100.0
    target: 125.0      # +25 % за 36 мес.
    rise: 24
    # Порог X1 снижен, чтобы быстрые ведущие показатели P2 (X2, X3) давали
    # заметный вклад уже в первом году, как в статье. Остальные узлы — 0.42.
    theta: 0.20
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [7.6, 0.4]

  X2:
    kind: indicator
    label: "Доля сотрудников, вовлечённых в программы креативности"
    short: "X2 · вовлечённость"
    unit: "%"
    direction: up
    base: 20.0
    target: 35.0
    rise: 12
    theta: 0.42
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [3.6, 4.4]

  X3:
    kind: indicator
    label: "Время от идеи до прототипа"
    short: "X3 · идея → прототип"
    unit: "мес."
    direction: down
    base: 12.0
    target: 7.0
    rise: 18
    theta: 0.42
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [3.6, 1.8]

  X4:
    kind: indicator
    label: "Бюджет на НИОКР и креативные подразделения"
    short: "X4 · бюджет НИОКР"
    unit: "% выручки"
    direction: up
    base: 2.5
    target: 5.0
    rise: 18
    theta: 0.42
    mu: 0.01
    x_max: 1.6
    monetization: {r: 0.0, volume: 0.0}
    position: [3.6, -1.8]

  X7:
    kind: indicator
    label: "Удельные затраты на единицу продукции"
    short: "X7 · удельные затраты"
    unit: "руб./ед."
    direction: down
    base: 1000.0
    target: 960.0      # −4 %, верхняя граница 2-4 % из статьи
    rise: 18
    theta: 0.42
    mu: 0.01
    x_max: 1.6
    monetization: {r: 1.0, volume: 1000000.0}  # 40 руб./ед. × 1 млн ед. = 40 млн руб./год
    position: [7.6, -3.4]

  Y2:
    kind: environment
    label: "Доступность государственных грантов"
    short: "Y2 · гранты"
    unit: "отклонение"
    direction: up
    nominal: 0.0
    position: [11.0, -2.0]

  Y3:
    kind: environment
    label: "Рыночное давление (ухудшение конъюнктуры)"
    short: "Y3 · рынок"
    unit: "отклонение"
    direction: down
    nominal: 0.0
    position: [11.0, 0.4]

  Y5:
    kind: environment
    label: "Дефицит квалификации новых сотрудников"
    short: "Y5 · квалификация"
    unit: "отклонение"
    direction: down
    nominal: 0.0
    position: [11.0, 4.0]

  m1:
    kind: measure
    label: "«Идеи за 5 минут» — ядро распределённой культуры P2"
    short: "m1 · идеи за 5 минут"
    unit: ""
    direction: up
    cost: 15.0         # млн руб., середина диапазона P2 10-20
    owner: "HR / отдел развития персонала"
    position: [0.0, 4.4]

  m3:
    kind: measure
    label: "Корпоративный акселератор / лаборатория — ядро P1"
    short: "m3 · акселератор"
    unit: ""
    direction: up
    cost: 35.0         # млн руб.; вместе с m4 даёт P1 = 70 млн
    owner: "R&D / корпоративный акселератор"
    position: [0.0, 1.0]

  m4:
    kind: measure
    label: "Программа патентования с бонусами — элемент P1"
    short: "m4 · патентование"
    unit: ""
    direction: up
    cost: 35.0         # млн руб.; P1 = m3 + m4 = 70 млн (диапазон 50-70)
    owner: "юридическая служба / патентный отдел"
    position: [0.0, -2.0]

edges:
  # P2: быстрые каналы через вовлечённость и скорость доводки идей.
  - {from: m1, to: X2, w: 0.60, delay: 1, source: "Л/Э", mechanism: "простая форма подачи снимает барьер участия"}
  - {from: m1, to: X3, w: 0.50, delay: 3, source: "Э",   mechanism: "быстрый отклик сокращает путь идеи"}
  # P1: акселератор даёт первые результаты, патентование — длинный хвост.
  - {from: m3, to: X3, w: 0.70, delay: 6, source: "Л",   mechanism: "выделенная команда доводит до прототипа"}
  - {from: m3, to: X4, w: 0.45, delay: 2, source: "Э",   mechanism: "акселератор требует и перераспределяет бюджет"}
  - {from: m3, to: X1, w: 0.31, delay: 12, source: "Э",  mechanism: "прямой канал акселератора к индексу"}
  - {from: m4, to: X1, w: 0.75, delay: 30, source: "Л",  mechanism: "патенты и бонусы дают отложенный вклад в индекс"}
  # Внутренние каналы каркаса.
  - {from: X2, to: X1, w: 0.60, delay: 0, source: "Л",   mechanism: "вовлечённость быстро превращается в предложения"}
  - {from: X3, to: X1, w: 0.55, delay: 3, source: "Э",   mechanism: "скорость доводки даёт внедрённые проекты"}
  - {from: X4, to: X1, w: 0.40, delay: 6, source: "Л",   mechanism: "ресурс без команды даёт отдачу с лагом"}
  - {from: X7, to: X1, w: 0.20, delay: 9, source: "Э",   mechanism: "экономия высвобождает ресурс на новые идеи"}
  - {from: X3, to: X7, w: 0.50, delay: 3, source: "Л",   mechanism: "быстрее прототип — ниже удельные затраты"}
  - {from: X2, to: X7, w: 0.40, delay: 6, source: "Л",   mechanism: "рацпредложения дают прямую экономию"}
  # Среда: те же знаки, что в karkas.tex.
  - {from: Y3, to: X1, w: -0.30, delay: 0, source: "Э",  mechanism: "неблагоприятный рынок гасит активность"}
  - {from: Y2, to: X4, w: 0.40, delay: 3, source: "Л",   mechanism: "гранты добавляют бюджет НИОКР"}
  - {from: Y5, to: X3, w: -0.35, delay: 6, source: "Л",  mechanism: "дефицит квалификации тормозит доводку"}
  - {from: X1, to: X4, w: 0.25, delay: 9, source: "Э",   mechanism: "успех финансирует НИОКР", optional: true}

# Расписание меры можно задать числом старта (непрерывно до конца периода)
# или словарём: {start: 0, end: 24, interval: 3, duration: 2, intensity: 1.0}.
# interval=0 или отсутствие interval — непрерывная работа до end.
plans:
  P1:
    label: "P1 · централизованная экосистема (акселератор + патентование)"
    measures: {m3: 0, m4: 0}
  P2:
    label: "P2 · распределённая культура улучшений"
    measures: {m1: 0}
  hybrid:
    label: "Гибрид · P2 сразу, акселератор P1 с 12-го мес."
    # Патентование m4 в гибрид не входит: это поэтапный запуск элементов P1.
    # Перебор без организационного ограничения видит и более агрессивный
    # вариант m1+m3 с 0-го месяца; в статье акселератор запускается на втором году.
    measures: {m1: 0, m3: 12}
  full:
    label: "P1 + P2 с первого месяца"
    measures: {m1: 0, m3: 0, m4: 0}

scenarios:
  nominal:
    label: "Номинальный"
    values: {}
  market_downturn:
    label: "Рынок: ухудшение"
    values: {Y3: 0.5}
  low_qualification:
    label: "Квалификация: дефицит"
    values: {Y5: 0.5}
  grant_cut:
    label: "Гранты: сокращение"
    values: {Y2: -0.4}
  combined_stress:
    label: "Комбинированный стресс"
    atomic: false       # это уже сумма событий, не отдельное событие
    values: {Y2: -0.4, Y3: 0.5, Y5: 0.5}
